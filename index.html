html,body{background:#2b2019}#app{background:var(--latte)}
#top{background:url(syoji_background.png) center/cover,var(--cocoa);color:var(--cream);padding:8px 12px;font-size:16px;text-shadow:0 1px 2px #0006}
#s0{background:url(cafe_background.png) center/cover,linear-gradient(#f6ead7,#e6cfb0)}
#s1{background:url(petkanri_background.png) center/cover,linear-gradient(#f3eadb,#dfe8d6);overflow-y:auto}

.bx{background:var(--cocoa);color:var(--cream);border:0;border-radius:14px;box-shadow:0 2px 0 #0003}

.ic{border:0!important;background:none!important;border-radius:0}.sil{background:none!important}
.ic b{font-size:min(9vw,44px);color:hsl(var(--h),45%,40%);text-shadow:0 2px 0 #fff8}.sil b{color:#222}.big .ic b{font-size:90px}.grid .ic b{font-size:26px}
.ic em{display:none}.grid .ic em{display:block;border:0;background:var(--cocoa);color:var(--cream);border-radius:6px;font-size:10px}

.box{background:var(--cream)}.ar button{border:0;background:#fffb;border-radius:12px;color:var(--cocoa)}
.eg{width:100%;aspect-ratio:1;display:grid;place-items:center;position:relative}.eg img{width:100%;height:100%;object-fit:contain}.em2{font-size:54px}.eg .ic{width:100%}

.acq{text-align:center}.acqt{font-size:40px;color:var(--rose)}.acqn{font-size:22px;margin-top:6px}.rb{display:inline-block;color:#fff;border-radius:10px;padding:1px 14px;margin:4px 0}.bts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ic b{display:none}.ic.nf b{display:block}#s1.on{display:block}#s1 .ar{margin:12px 0!important}.st i{background:var(--rose)}.warn{background:#fde3df;color:#a2392e;border-radius:10px;padding:8px;font-size:13px;margin:4px 0}

.g4{margin-top:124px}.ttl{margin-top:130px}#s1 .dv .ar{margin-right:62px!important}

/* ================= 演出（明るめ・ポップ） ================= */
.ol{text-shadow:2px 0 var(--o),-2px 0 var(--o),0 2px var(--o),0 -2px var(--o),1.5px 1.5px var(--o),-1.5px 1.5px var(--o),1.5px -1.5px var(--o),-1.5px -1.5px var(--o),0 4px 0 var(--o)}
.fe{display:block;line-height:1;text-align:center}
.st4{position:absolute;width:var(--s,14px);height:var(--s,14px);margin:calc(var(--s,14px)/-2) 0 0 calc(var(--s,14px)/-2);background:var(--c,#ffd23f);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);pointer-events:none;animation:tw .75s var(--d,0s) ease-out both}
@keyframes tw{0%{transform:scale(0) rotate(0);opacity:0}35%{transform:scale(1.25) rotate(70deg);opacity:1}100%{transform:scale(0) rotate(200deg);opacity:0}}
.bw0{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
.cbp{position:absolute;left:var(--x0,50%);top:var(--y0,30%);width:var(--w,7px);height:calc(var(--w,7px)*1.5);background:var(--c,#ffd23f);border-radius:2px;pointer-events:none;animation:cb var(--t,.9s) var(--d,0s) cubic-bezier(.15,.7,.4,1) both}
.cbp.cc{height:var(--w,7px);border-radius:50%}
.cbp.cs{width:calc(var(--w,7px)*2);height:calc(var(--w,7px)*2);border-radius:0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes cb{0%{transform:translate(0,0) rotate(0) scale(.3);opacity:0}8%{opacity:1}40%{transform:translate(calc(var(--dx)*.85),var(--dy)) rotate(calc(var(--r)*.5)) scale(1.1);opacity:1;animation-timing-function:cubic-bezier(.5,0,.9,.6)}100%{transform:translate(var(--dx),calc(var(--dy) + var(--g,60px))) rotate(var(--r)) scale(.8);opacity:0}}
.cfl{position:absolute;top:-16px;width:var(--w,7px);height:calc(var(--w,7px)*1.5);background:var(--c);border-radius:2px;animation:cf var(--t,2.6s) var(--d,0s) linear both}
.cfl.cc{height:var(--w,7px);border-radius:50%}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}80%{opacity:1}100%{transform:translate(var(--x),105vh) rotate(var(--r));opacity:0}}

/* ジャンプ（つぶれて→伸びて→着地でむにゅっ） */
.ic{transform-origin:50% 100%}
.jp{animation:j .6s both}
@keyframes j{
0%{transform:translateY(0) scale(1,1);animation-timing-function:ease-out}
10%{transform:translateY(0) scale(1.13,.85);animation-timing-function:cubic-bezier(.2,.7,.3,1)}
45%{transform:translateY(-52px) scale(.93,1.1);animation-timing-function:cubic-bezier(.6,0,.9,.5)}
86%{transform:translateY(0) scale(.97,1.05);animation-timing-function:ease-out}
92%{transform:translateY(0) scale(1.17,.8);animation-timing-function:ease-out}
100%{transform:translateY(0) scale(1,1)}}
.sh{position:absolute;left:18%;right:18%;bottom:0;height:9%;background:rgba(110,70,50,.22);border-radius:50%;filter:blur(1.5px);z-index:-1;pointer-events:none}
@keyframes sh{0%,100%{transform:scale(1);opacity:1}45%{transform:scale(.5);opacity:.4}}
#fxl{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}

/* 着地のぽふっ */
.puf{position:absolute;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:1}
.puf .pr{position:absolute;left:50%;bottom:4px;width:62%;height:14px;margin-left:-31%;border:3px solid #fff;border-radius:50%;box-shadow:0 0 8px #fff9;opacity:0;animation:pr .5s ease-out both}
@keyframes pr{0%{transform:scale(.35,.35);opacity:.95}100%{transform:scale(1.7,1.25);opacity:0}}

/* +コイン表示 */
.pop{position:absolute;left:-34px;right:-34px;top:-10px;text-align:center;white-space:nowrap;pointer-events:none;z-index:4;font-size:19px;line-height:1.05;letter-spacing:.5px;animation:pp 1.15s both}

.pop.bo .pk{font-size:16px;--o:#7c3aed}
@keyframes pp{0%{transform:translateY(12px) scale(.2) rotate(var(--rt,0deg));opacity:0;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
14%{transform:translateY(-6px) scale(1.35) rotate(var(--rt,0deg));opacity:1;animation-timing-function:ease-out}
28%{transform:translateY(-14px) scale(1) rotate(0deg);opacity:1}
72%{opacity:1}
100%{transform:translateY(-58px) scale(1);opacity:0}}

/* コウモリ（bat.png）：右下→左上 */
.bat{position:absolute;pointer-events:none;animation:bx var(--t) cubic-bezier(.45,0,.55,1) var(--d) both,bop var(--t) linear var(--d) both}
.bat .by{animation:by var(--t) cubic-bezier(.2,.7,.45,1) var(--d) both}
.bf{animation:flap .15s ease-in-out infinite alternate;filter:drop-shadow(0 3px 0 rgba(255,255,255,.8)) drop-shadow(0 0 9px rgba(255,150,60,.65))}
.bf img{display:block;width:100%;height:auto}

/* おばけ（ghosts.png）：左上→右下へ、薄くなりながら */

.ov{transition:none}
#ov[data-k=acqx]{background:radial-gradient(circle at 50% 38%,rgba(255,244,205,.8),rgba(255,170,208,.6) 58%,rgba(120,85,170,.6))}

.stg{position:relative;display:flex;justify-content:center;padding:6px 0}

 if(S.pets.length+tot>MAXB)return toast('バッグの上限('+MAXB+'体)を超えます');

 rc();bar();save();rs();toast(tot+'体を入手しました'+(pc?'（'+pc+'体をカフェに配置）':'')+(fix?'\n※速度は0.33〜1.00に補正しました':''),3500)}

 let h=`<div class="tsh"><b>ペットステータス選択</b><div class="tsc">${ORD.map(r=>{const n=TS.filter(x=>C[x.id].r==r).length;return`<button class="btn${TF==r?' pri':''}" onclick="tsF('${r}')">${r}${n?'('+n+')':''}</button>`}).join('')}</div></div>`;

 h+=`<h3 style="color:var(--cocoa)">ステータス設定</h3>`;
 if(!TS.length)h+=`<div class="pn" style="text-align:center;color:var(--cocoa)">上のキャラをタップして選択してください</div>`;

/* ---------- 計測シミュレーション ---------- */
const MDU=iv=>Math.min(600,iv*.85);
function simNew(pl,off){const o=pl.map((p,i)=>{const c=C[p.c];return{i,p,c,k:calc(p,pl),ln:LND(c),acc:0,sx:0,e:0,a:0,n:0,nn:0,last:null,mi:Infinity,me:0,ma:0}});
 return{t:0,off,o,q:[],w:pl.findIndex(p=>C[p.c].n=='イチゴツリー わたげ'),ld:0,sn:0,sa:o.reduce((t,x)=>t+x.k.a,0)}}
function simLand(s,i,t){const x=s.o[i],c=x.c,k=x.k,n=c.n,sm=(s.w>=0&&s.sn>t)?2:1,B=m=>1+(m-1)*sm;
 let e=k.e,a=k.a,sb=!!x.sx;const r=Math.random();x.sx=0;
 if(XM.has(n)){e*=B(1.2);a*=B(1.2)}
 if(n=='コウモリちょこ'&&r<.25)e*=B(2);
 if(n=='おばけぷりん'&&r<.25)a*=B(2);
 if(n=='サンタぱんぴー'&&Math.random()<.5){const iv=k.sp*1000;s.o.forEach(y=>{if(y===x)return;y.acc=0;y.sx=1;s.q.push({t:t+MDU(iv)*.88,i:y.i})});sb=true}
 if(n=='野菜いっぱいぱんぴー&かのん'&&Math.random()<.2)a*=B(2);
 if(n=='コウモリれもん'){e*=B(3);a*=B(3)}
 if(s.w>=0){s.ld++;if(s.ld%1000==0)s.sn=t+3e4}
 if(sb)e+=a*1.5*sm;
 x.e+=e;x.a+=a;x.n++;if(x.last!=null){const d=t-x.last;if(d<x.mi)x.mi=d}x.last=t;if(e>x.me)x.me=e;if(a>x.ma)x.ma=a}
function simOff(s,dt){const t0=s.t,t1=t0+dt;let N=0;s.o.forEach(x=>{x.nn=dt/(x.k.sp*5e3);N+=x.nn});let f=0;
 if(s.w>=0){const l0=s.ld,l1=l0+N,tr=Math.floor(l1/1e3)-Math.floor(l0/1e3);let un=Math.max(0,Math.min(t1,s.sn)-t0);
  if(tr>0){const tc=t0+(Math.floor(l1/1e3)*1e3-l0)/N*dt;un=s.sn>=tc?dt:un+(t1-tc);s.sn=tc+3e4}
  s.ld=l1;f=un/dt}
 s.o.forEach(x=>{let xe=1,xa=1,se=1,sa=1;x.ln.forEach(([,pr,m1,m2])=>{xe*=1+pr*(m1-1);xa*=1+pr*(m2-1);se*=1+pr*(m1-1)*2;sa*=1+pr*(m2-1)*2});
  x.e+=x.k.e*((1-f)*xe+f*se)*x.nn;x.a+=x.k.a*((1-f)*xa+f*sa)*x.nn;x.n+=x.nn;
  x.me=Math.max(x.me,x.k.e*(f>0?se:xe));x.ma=Math.max(x.ma,x.k.a*(f>0?sa:xa))});
 s.o.forEach(x=>{if(x.c.n=='サンタぱんぴー'){const b=x.nn*.5*1.5*(1+f);s.o.forEach(y=>{y.e+=b*y.k.a})}})}
function simStep(s){const T=s.t+100;
 if(s.off){simOff(s,100);s.t=T;return}
 for(;;){let j=-1;s.q.forEach((e,u)=>{if(e.t<=T&&(j<0||e.t<s.q[j].t))j=u});if(j<0)break;const e=s.q.splice(j,1)[0];simLand(s,e.i,e.t)}
 s.o.forEach(x=>{x.acc+=100;const iv=x.k.sp*1000;if(x.acc>=iv){x.acc%=iv;s.q.push({t:T+MDU(iv)*.88,i:x.i})}});
 s.t=T}
function simSum(s){let e=0,a=0,n=0,me=0,ma=0,mei=-1,mai=-1,mi=Infinity,mii=-1,th=Infinity;
 s.o.forEach((x,i)=>{e+=x.e;a+=x.a;n+=x.n;if(x.me>me){me=x.me;mei=i}if(x.ma>ma){ma=x.ma;mai=i}const v=s.off?x.k.sp*5e3:x.mi;if(v<mi){mi=v;mii=i}th=Math.min(th,x.k.sp*(s.off?5:1)*1e3)});
 return{e,a,n,me,ma,mei,mai,mi,mii,th}}

function meaShow(){const m=MR,r=m.r,o=m.o,sec=m.dur/1e3,L=m.lb,nm=i=>i<0?'':'（'+L[i]+'）';
